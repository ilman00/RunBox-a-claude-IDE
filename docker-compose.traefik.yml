version: "3.9"

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.dashboard=true"                       # enable Traefik dashboard
      - "--api.insecure=true"                        # dashboard without auth (disable in prod!)
      - "--providers.docker=true"                    # enable docker provider
      - "--providers.docker.exposedbydefault=false"  # only route containers with traefik.enable=true
      - "--entrypoints.web.address=:80"              # HTTP
      - "--entrypoints.websecure.address=:443"       # HTTPS
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - runbox

networks:
  runbox:
    external: true   # make sure you create this network manually: docker network create runbox
